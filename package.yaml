---
name: effectful-data-cache
version: 0.1.0.4
github: haskell-github-trust/effectful-data-cache
license: BSD-3-Clause
author: drlkf
maintainer: drlkf <drlkf@drlkf.net>
copyright: 2026 drlkf

extra-source-files:
  - README.md

extra-docs-files:
  - CHANGELOG.md

category: cache
synopsis: Data cache effect for the `effectful` system
description: >-
  Please see the README on GitHub at
  <https://github.com/haskell-github-trust/effectful-data-cache#readme>

dependencies:
  - base >= 4.7 && < 5
  - cache >= 0.1.3 && < 0.2
  - clock >= 0.8 && < 0.9
  - effectful-core >= 2.3 && < 3
  - hashable >= 1.5 && < 2
  - hs-opentelemetry-api >= 0.3 && < 0.4
  - text >= 2.1 && < 3

ghc-options:
  - -Wall
  - -Wextra
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-data-cache-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - effectful-data-cache
      - hspec
      - effectful-core
      - hs-opentelemetry-api
      - hs-opentelemetry-sdk
      - hs-opentelemetry-exporter-in-memory
      - text
      - unordered-containers
    build-tools:
      - hspec-discover
