name: Build

on:
  push:
  workflow_call:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      stack-yamls: ${{ steps.matrix.outputs.stack-yamls }}
    steps:
      - uses: actions/checkout@v6

      - id: matrix
        uses: freckle/stack-action/generate-matrix@v5
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"

      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "effectful-data-cache-opentelemetry/src/", "effectful-data-cache-opentelemetry/test/", "effectful-data-cache-memcache/src/", "effectful-data-cache-memcache/test/"]'
          fail-on: warning

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.21.0.0"
          pattern: |
            src/**/*.hs
            test/**/*.hs
            effectful-data-cache-opentelemetry/src/**/*.hs
            effectful-data-cache-opentelemetry/test/**/*.hs
            effectful-data-cache-memcache/src/**/*.hs
            effectful-data-cache-memcache/test/**/*.hs

  build:
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        stack-yaml: ${{ fromJSON(needs.generate-matrix.outputs.stack-yamls) }}
    steps:
      - uses: actions/checkout@v6

      # macOS runners have no service containers; memcache tests skip there
      - if: runner.os == 'Linux'
        run: docker run -d -p 11211:11211 memcached:1.6

      - uses: freckle/stack-action@v5
        with:
          cache-prefix: v2/
        env:
          STACK_YAML: ${{ matrix.stack-yaml }}
