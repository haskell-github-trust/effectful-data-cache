---
name: effectful-data-cache-opentelemetry
version: 0.2.2.0
github: haskell-github-trust/effectful-data-cache
license: BSD-3-Clause
author: drlkf
maintainer: drlkf <drlkf@drlkf.net>
copyright: 2026 drlkf

extra-source-files:
  - README.md

extra-doc-files:
  - CHANGELOG.md

category: cache
synopsis: OpenTelemetry instrumentation for effectful-data-cache
description: >-
  Please see the README on GitHub at
  <https://github.com/haskell-github-trust/effectful-data-cache/tree/main/effectful-data-cache-opentelemetry#readme>

dependencies:
  - base >= 4.7 && < 5
  - effectful-core >= 2.3 && < 3
  - effectful-data-cache >= 0.1.0.4 && < 0.3
  - hs-opentelemetry-api >= 1.0 && < 1.1
  - text >= 2.1 && < 3

ghc-options:
  - -Wall
  - -Wextra
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-data-cache-opentelemetry-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - effectful-data-cache-opentelemetry
      - effectful-data-cache
      - hspec
      - effectful-core
      - hs-opentelemetry-api
      - hs-opentelemetry-sdk
      - hs-opentelemetry-exporter-in-memory
      - text
    build-tools:
      - hspec-discover
